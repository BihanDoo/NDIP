<section id="support" class="py-5 bg-white">
    <div class="container">
      <div class="row g-4">
        <div class="col-lg-6">
          <h2 class="section-title mb-3">Need help?</h2>
          <p>
            Use the form to request support.
          </p>
          <form id="supportForm" data-endpoint="/api/support">
            <div class="mb-3">
              <label class="form-label">Full name</label>
              <input type="text" class="form-control" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Issue</label>
              <textarea class="form-control" rows="3" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">
              Submit request
            </button>
          </form>
        </div>
        <div class="col-lg-6">
          <div class="p-4 border rounded-3 bg-light">
            <h5 class="mb-3">Live system status</h5>
            <p class="text-muted small">
              Placeholder badges show how realtime data can be plugged in
              later.
            </p>
            <div class="d-flex flex-wrap gap-2" id="statusBadges">
              <span class="badge text-bg-success" data-status="core"
                >Core platform</span
              >
              <span class="badge text-bg-success" data-status="api"
                >API Gateway</span
              >
              <span class="badge text-bg-warning text-dark" data-status="ivr"
                >Hotline</span
              >
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>






























  <div class="row g-4">
    <div class="col-lg-6">
      <div class="p-4 service-card h-100">
        <h5>Update Citizen Details</h5>
        <form class="row g-3 citizen-form" data-endpoint="/api/citizens/update">
          <div class="col-12">
            <label class="form-label">NDI ID</label>
            <input type="text" class="form-control" required />
          </div>
          <div class="col-md-6">
            <label class="form-label">New NDI ID</label>
            <input type="text" class="form-control" />
          </div>
          <div class="col-md-6">
            <label class="form-label">New First Name</label>
            <input type="text" class="form-control" />
          </div>
          <div class="col-12">
            <button type="submit" class="btn btn-primary">
              Update Citizen
            </button>
          </div>
        </form>
      </div>
    </div>

    <div class="col-lg-6">
      <div class="p-4 service-card h-100">
        <h5>Delete Citizen</h5>
        <form class="row g-3 citizen-form" data-endpoint="/api/citizens/delete">
          <div class="col-12">
            <label class="form-label">NDI ID</label>
            <input type="text" class="form-control" required />
          </div>
          <div class="col-12">
            <button type="submit" class="btn btn-outline-primary">
              Delete Citizen
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
  



















  <script>
      (function () {
        $(".citizen-form").on("submit", function (event) {
          event.preventDefault();
          const endpoint = $(this).data("endpoint");
          const API_BASE = 'http://localhost:3000';

          // If this is the ID lookup endpoint (ends with /id), perform a GET
          if (typeof endpoint === 'string' && endpoint.match(/\/id$|\/id\/?$/)) {
            // read the id value from the form (input with id SId)
            const idVal = $(this).find('#SId').val();
            if (!idVal) {
              alert('Please enter an NDI ID');
              return;
            }

            // Build the URL by replacing '/id' with '/{id}' (or appending if necessary)
            const basePath = endpoint.replace(/\/id\/?$/, '');
            const url = (API_BASE + basePath + '/' + encodeURIComponent(idVal));

            $.ajax({
              url: url,
              type: 'get',
              contentType: 'application/json',
              dataType: 'json',
              success: function (data, textStatus, jQxhr) {
                // Populate result fields if present
                if ($('#SName').length) {
                  // try to build a friendly name from FirstName/LastName or fallback to data.name
                  const name = (data.FirstName || data.name || '') + (data.LastName ? (' ' + data.LastName) : '');
                  $('#SName').val(name.trim());
                }
                if ($('#SAddress').length) {
                  // use address if provided, otherwise fallback to Nationality
                  $('#SAddress').val(data.address || data.Nationality || '');
                }
              },
              error: function (jqXhr, textStatus, errorThrown) {
                console.log(errorThrown);
                alert('Lookup failed: ' + (jqXhr.status || '') + ' ' + (jqXhr.responseText || errorThrown));
              }
            });
          } else {
            // Non-ID lookup: keep current behaviour (informational)
            alert("Form is ready to send to " + endpoint);
          }
        });

        $("#showAllBtn").on("click", function () {
          alert("Show all citizens data-endpoint: " + $(this).data("endpoint"));
        });
      })();
    </script>
