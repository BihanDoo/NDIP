<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NDI Portal • Citizen Lookup</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="indexstyle.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg shadow-sm py-3">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html"
          >National Digital Identity Portal</a
        >
        <div class="ms-auto d-flex gap-2">
          <a class="btn btn-outline-primary btn-sm" href="index.html">Home</a>
        </div>
      </div>
    </nav>
 <header class="hero text-center">
      <div class="container">
        <p class="text-uppercase text-white-50 mb-2">Update Citizen</p>
        <h1 class="fw-semibold">Update Citizen Details</h1>
        <p class="mb-0">
          Use the forms below to update citizen records in the digital system.
        </p>
      </div>
    </header>

    <!-- MAIN -->
    <main class="py-5">
      <div class="container">
        <div class="row g-4">
          <div class="col-lg-8 mx-auto">

            <div class="accordion" id="updateAccordion">

              <!-- UPDATE BY NDI ID -->
              <div class="accordion-item">
                <h2 class="accordion-header">
                  <button
                    class="accordion-button"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#updateById"
                  >
                    Update Citizen by NDI ID
                  </button>
                </h2>

                <div
                  id="updateById"
                  class="accordion-collapse collapse show"
                  data-bs-parent="#updateAccordion"
                >
                  <div class="accordion-body">

                    <form id="updateFormId" class="row g-3" >
                      <div class="col-12">
                        <label class="form-label">NDI ID</label>
                        <input
                          type="text"
                          name="NDI_ID"
                          class="form-control"
                          placeholder="e.g. NDI-123456"
                          id="ndiId"
                          required
                        />
                      </div>

                      <div class="col-md-6">
                        <label class="form-label">New First Name</label>
                        <input type="text" name="FirstName" value="testABC" class="form-control" />
                      </div>

                      <div class="col-md-6">
                        <label class="form-label">New Last Name</label>
                        <input type="text" name="LastName"value="testABC" class="form-control" />
                      </div>

                      <div class="col-md-6">
                        <label class="form-label">New Email</label>
                        <input type="email" name="Email"value="testABC@abc.co" class="form-control" />
                      </div>

                      <div class="col-md-6">
                        <label class="form-label">New Phone</label>
                        <input type="tel" name="Phone"value="123879654" class="form-control" />
                      </div>

                      <div class="col-md-6">
                        <label class="form-label">New Occupation</label>
                        <input type="text" name="Occupation" value="testABC" class="form-control" />
                      </div>

                      <div class="col-12">
                        <button type="submit" class="btn btn-primary">
                          Update Citizen
                        </button>
                      </div>
                    </form>

                  </div>
                </div>
              </div>

              <!-- UPDATE BY FIRST NAME -->
              <div class="accordion-item">
                <h2 class="accordion-header">
                  <button
                    class="accordion-button collapsed"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#updateByFName"
                  >
                    Update Citizen by First Name
                  </button>
                </h2>

                <div
                  id="updateByFName"
                  class="accordion-collapse collapse"
                  data-bs-parent="#updateAccordion"
                >
                  <div class="accordion-body">

                    <form id="updateFormName" class="row g-3" >
                      <div class="col-12">
                        <label class="form-label">Current First Name</label>
                        <input type="text" name="FirstName" value="testABC" class="form-control" required />
                      </div>

                      <div class="col-md-6">
                        <label class="form-label">New Last Name</label>
                        <input type="text" name="LastName" value="abceetestABC" class="form-control" />
                      </div>

                      <div class="col-md-6">
                        <label class="form-label">New Email</label>
                        <input type="email" name="Email" value="testABC@abcbc.co" class="form-control" />
                      </div>

                      <div class="col-md-6">
                        <label class="form-label">New Phone</label>
                        <input type="tel" name="Phone" value="123978654" class="form-control" />
                      </div>

                      <div class="col-md-6">
                        <label class="form-label">New Occupation</label>
                        <input type="text" name="Occupation" value="testABC" class="form-control" />
                      </div>

                      <div class="col-12">
                        <button type="submit" class="btn btn-primary">
                          Update Citizen
                        </button>
                      </div>
                    </form>

                  </div>
                </div>
              </div>

            </div>

            <hr class="my-4" />

            <pre id="resultArea" class="p-3 bg-light border rounded">
Click an update button to test the API...
            </pre>

          </div>
        </div>
      </div>
    </main>

    <!-- FOOTER -->
    <footer class="py-4 bg-dark text-white text-center">
      <p class="mb-0">© 2025 National Digital Identity Office</p>
    </footer>

     <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      function handleUpdate(formSelector) {
        const urlip = window.location.hostname;
        const form = $(formSelector);

        form.on('submit', function (e) {
          e.preventDefault();

          const formDataArray = form.serializeArray();
          const dataObj = {};
          formDataArray.forEach(x => dataObj[x.name] = x.value);

          // If this is the ID-based form, use the NDI ID directly
          if (formSelector === '#updateFormId') {
            const NID = $('#ndiId').val();
            if (!NID) {
              alert('NDI ID is required.');
              return;
            }

            $('#resultArea').text('Updating...');
            console.log('Submitting data (by NID):', dataObj);

            $.ajax({
              
              url: 'http://' + urlip + '/api/citizens/update/?id=' + encodeURIComponent(NID),
              method: 'PUT',
              contentType: 'application/json',
              data: JSON.stringify(dataObj),
              success: function (res) {
                $('#resultArea').text(JSON.stringify(res, null, 2));
              },
              error: function (xhr) {
                $('#resultArea').text('Error: ' + xhr.status + '\n' + xhr.responseText);
              }
            });

            return;
          }

          // Otherwise handle update by FirstName: lookup by FirstName then update by NID
          if (formSelector === '#updateFormName') {
            const firstName = dataObj.FirstName && dataObj.FirstName.trim();
            if (!firstName) {
              alert('Current First Name is required.');
              return;
            }

            $('#resultArea').text('Searching for matching citizens...');
            console.log('Searching by FirstName:', firstName);
const urlip = window.location.hostname;
            $.ajax({
              url: 'http://' + urlip + '/api/citizens?FirstName=' + encodeURIComponent(firstName),
              method: 'GET',
              dataType: 'json',
              success: function (list) {
                if (!list || list.length === 0) {
                  $('#resultArea').text('No citizens found with that first name.');
                  return;
                }

                if (list.length > 1) {
                  $('#resultArea').text('Multiple citizens found. Please refine your search or use NDI ID.');
                  return;
                }

                const citizen = list[0];
                const nid = citizen.NID || citizen.nid || citizen.NDI_ID || citizen.id;
                if (!nid) {
                  $('#resultArea').text('Found citizen does not have an NID to update.');
                  return;
                }

                $('#resultArea').text('Updating citizen with NID: ' + nid);
                console.log('Submitting data (by FirstName -> NID):', dataObj);
                const urlip = window.location.hostname;
                $.ajax({
                  url: 'http://' + urlip + '/api/citizens/update/?id=' + encodeURIComponent(nid),
                  method: 'PUT',
                  contentType: 'application/json',
                  data: JSON.stringify(dataObj),
                  success: function (res) {
                    $('#resultArea').text(JSON.stringify(res, null, 2));
                  },
                  error: function (xhr) {
                    $('#resultArea').text('Error: ' + xhr.status + '\n' + xhr.responseText);
                  }
                });
              },
              error: function (xhr) {
                $('#resultArea').text('Search error: ' + xhr.status + '\n' + xhr.responseText);
              }
            });
          }
        });
      }

      $(document).ready(function () {
        handleUpdate('#updateFormId');
        handleUpdate('#updateFormName');
      });
    </script>
  </body>
</html>
